<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CHS Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fdf0f5;--surface:#fff;
  --pink:#d4638a;--pink-dark:#b84d72;--pink-light:#f0a0bf;--pink-pale:#fdeef5;--pink-border:#f2c8d8;
  --text:#2d1520;--text-mid:#7a4d60;--text-light:#b08898;
  --green:#27ae60;--green-bg:#e8f8ee;--orange:#f39c12;--orange-bg:#fef3e2;--red:#e74c3c;
  --shadow:0 2px 12px rgba(180,80,120,.10);--shadow-md:0 4px 20px rgba(180,80,120,.14);
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Poppins',sans-serif;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}

/* ── PIN ── */
#pin-screen{position:fixed;inset:0;z-index:1000;background:linear-gradient(145deg,#fce4ef 0%,#f5c6dc 50%,#fde8f2 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:430px;left:50%;transform:translateX(-50%);right:auto;width:100%}
.pin-logo{font-family:'DM Serif Display',serif;font-size:38px;color:var(--pink-dark);letter-spacing:-1px;margin-bottom:4px}
.pin-tagline{font-size:12px;font-weight:600;color:var(--text-mid);letter-spacing:1px;text-transform:uppercase;margin-bottom:36px}
.pin-dots{display:flex;gap:14px;margin-bottom:32px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--pink-light);background:transparent;transition:all .15s}
.pin-dot.filled{background:var(--pink-dark);border-color:var(--pink-dark)}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.pin-btn{height:72px;border-radius:20px;border:none;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);font-size:22px;font-weight:700;color:var(--text);cursor:pointer;box-shadow:0 2px 12px rgba(180,80,120,.15);font-family:'Poppins',sans-serif;transition:all .1s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.pin-btn:active{transform:scale(.93);background:var(--pink-pale)}
.pin-btn.del{font-size:20px;color:var(--text-mid)}
.pin-btn.empty{background:transparent;box-shadow:none;pointer-events:none}
.pin-sub{font-size:9px;color:var(--text-light);font-weight:700;letter-spacing:1.2px}
.pin-error{margin-top:16px;font-size:13px;color:var(--red);font-weight:700;min-height:20px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ── TOPBAR ── */
.topbar{background:linear-gradient(135deg,#b84d72 0%,#e8719a 100%);padding:env(safe-area-inset-top,14px) 16px 14px;padding-top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 4px 20px rgba(160,50,90,.25)}
.topbar-title{font-family:'DM Serif Display',serif;font-size:24px;color:#fff;letter-spacing:-.5px}
.signout-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);cursor:pointer;display:flex;align-items:center;justify-content:center}
.signout-btn:active{background:rgba(255,255,255,.3)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#6ee08b;margin-right:8px;flex-shrink:0}
.sync-dot.syncing{background:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── LAYOUT ── */
.scroll-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:90px}
.section{display:none}.section.active{display:block}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1.5px solid var(--pink-border);display:flex;padding-bottom:env(safe-area-inset-bottom,0);z-index:100;box-shadow:0 -4px 20px rgba(180,80,120,.10)}
.nav-btn{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:transparent;font-family:'Poppins',sans-serif;transition:background .1s}
.nav-btn:active{background:var(--pink-pale)}
.nav-lbl{font-size:10px;font-weight:700;color:var(--text-light);transition:color .15s}
.nav-btn.active .nav-lbl{color:var(--pink-dark)}
.nav-icon{font-size:20px;transition:transform .15s}
.nav-btn.active .nav-icon{transform:scale(1.15)}

/* ── FAB ── */
.fab{position:fixed;bottom:80px;right:calc(50% - 200px);width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#b84d72,#e8719a);border:none;cursor:pointer;box-shadow:0 6px 24px rgba(160,50,90,.4);display:flex;align-items:center;justify-content:center;z-index:50;color:#fff;font-size:28px;font-weight:300;transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab.gone{display:none}

/* ── INCOME BANNER ── */
.income-banner{margin:14px 14px 8px;background:linear-gradient(135deg,#b84d72 0%,#e8719a 100%);border-radius:20px;padding:18px 18px 14px;box-shadow:0 6px 28px rgba(160,50,90,.28);color:#fff}
.ib-lbl{font-size:11px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.9px;margin-bottom:2px}
.ib-amt{font-family:'DM Serif Display',serif;font-size:40px;letter-spacing:-1.5px;margin-bottom:12px}
.ib-filters{display:flex;gap:6px;flex-wrap:wrap}
.filt-btn{padding:5px 11px;border-radius:20px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.75);font-size:11px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;transition:all .15s}
.filt-btn.on{background:#fff;color:var(--pink-dark);border-color:#fff}
.custom-range{display:none;gap:6px;margin-top:8px}
.custom-range.open{display:flex}
.custom-range input{flex:1;padding:6px 10px;border:1.5px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-family:'Poppins',sans-serif;font-size:12px;outline:none;min-width:0}
.custom-range input::-webkit-calendar-picker-indicator{filter:invert(1)}

/* ── CARDS WRAP ── */
.cards-wrap{padding:4px 14px}
.section-lbl{font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin:10px 0 8px}

/* ── INCOME CARD ── */
.ic{background:#fff;border-radius:16px;margin-bottom:10px;border:1.5px solid var(--pink-border);box-shadow:var(--shadow);overflow:hidden;border-left:4px solid var(--pink-light)}
.ic.paid{border-left-color:var(--green)}
.ic.pending{border-left-color:var(--orange)}
.ic-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px 5px}
.ic-date{font-size:12px;font-weight:700;color:var(--text-light)}
.ic-badges{display:flex;gap:4px;align-items:center}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.badge.paid{background:var(--green-bg);color:var(--green)}
.badge.pending{background:var(--orange-bg);color:var(--orange)}
.badge.tracker{background:#e8f0fe;color:#3355bb}
.ic-name{padding:0 13px 4px;font-size:16px;font-weight:800;color:var(--text);cursor:pointer}
.ic-name:active{color:var(--pink)}
.ic-tags{padding:0 13px 8px;display:flex;flex-wrap:wrap;gap:4px}
.ic-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--pink-pale);color:var(--pink-dark);border:1px solid var(--pink-border)}
.ic-foot{padding:8px 13px 12px;border-top:1px solid var(--bg);display:flex;align-items:flex-end;justify-content:space-between}
.ic-money{display:flex;flex-direction:column;gap:2px}
.ic-total{font-size:18px;font-weight:800;color:var(--text)}
.ic-dep-line{font-size:11px;color:var(--text-mid);font-weight:500}
.ic-bal{font-size:12px;font-weight:700;color:var(--orange)}
.ic-paid-line{font-size:11px;font-weight:700;color:var(--green)}
.ic-btns{display:flex;gap:6px}
.ic-btn{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--pink-border);background:var(--pink-pale);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.ic-btn:active{background:var(--pink-light)}
.ic-btn.danger{border-color:#fdd;background:#fff5f5}

/* ── EXPENSE CARD ── */
.ec{background:#fff;border-radius:14px;margin-bottom:9px;border:1.5px solid var(--pink-border);box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.ec:active{background:var(--pink-pale)}
.ec-thumb{width:44px;height:44px;border-radius:10px;background:var(--pink-pale);border:1.5px solid var(--pink-border);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.ec-thumb img{width:100%;height:100%;object-fit:cover}
.ec-info{flex:1;min-width:0}
.ec-desc{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-date{font-size:12px;color:var(--text-light);font-weight:500;margin-top:1px}
.ec-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ec-amt{font-size:16px;font-weight:800;color:var(--red)}
.ec-rcpt{font-size:10px;color:var(--pink);font-weight:700}

/* ── EXPENSE SUMMARY CARD ── */
.exp-top-card{margin:14px 14px 4px;background:#fff;border-radius:16px;padding:16px;border:1.5px solid var(--pink-border);box-shadow:var(--shadow)}
.etc-lbl{font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.etc-amt{font-family:'DM Serif Display',serif;font-size:30px;color:var(--pink-dark)}

/* ── SUMMARY TAB ── */
.sum-wrap{padding:14px}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:11px 14px;border:1.5px solid var(--pink-border);margin-bottom:14px;box-shadow:var(--shadow)}
.mnav-btn{width:32px;height:32px;border-radius:10px;border:none;background:var(--pink-pale);cursor:pointer;font-size:18px;color:var(--pink-dark);display:flex;align-items:center;justify-content:center;font-weight:700}
.mnav-lbl{font-size:15px;font-weight:800;color:var(--text)}
.sum-card{background:#fff;border-radius:16px;padding:16px;border:1.5px solid var(--pink-border);box-shadow:var(--shadow);margin-bottom:10px}
.sum-card-lbl{font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.sum-card-amt{font-family:'DM Serif Display',serif;font-size:30px;color:var(--text)}
.sum-card-amt.pink{color:var(--pink-dark)}
.sum-card-amt.green{color:var(--green)}
.sum-card-sub{font-size:12px;color:var(--text-light);font-weight:500;margin-top:2px}
.reserve-wrap{background:linear-gradient(135deg,#fde8f2,#fad0e4);border-radius:16px;padding:16px;border:1.5px solid var(--pink-border);margin-bottom:10px}
.res-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.res-pct{font-size:32px;font-weight:800;color:var(--pink-dark)}
.res-amt{font-family:'DM Serif Display',serif;font-size:22px;color:var(--pink-dark)}
.reserve-slider{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:rgba(180,80,120,.2);outline:none;margin:4px 0 8px}
.reserve-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--pink-dark);cursor:pointer;box-shadow:0 2px 8px rgba(160,50,90,.35)}
.partner-row{background:#fff;border-radius:13px;padding:13px 14px;border:1.5px solid var(--pink-border);box-shadow:var(--shadow);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.pr-left .pr-name{font-size:15px;font-weight:800;color:var(--text)}
.pr-left .pr-pct{font-size:12px;color:var(--text-mid);font-weight:500;margin-top:1px}
.pr-amt{font-family:'DM Serif Display',serif;font-size:24px;color:var(--green)}

/* ── SETTINGS TAB ── */
.set-wrap{padding:14px}
.set-group{background:#fff;border-radius:16px;border:1.5px solid var(--pink-border);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.set-group-title{padding:10px 15px;font-size:10px;font-weight:800;color:var(--text-light);text-transform:uppercase;letter-spacing:1px;background:var(--pink-pale);border-bottom:1px solid var(--pink-border)}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--bg);cursor:pointer}
.set-row:last-child{border-bottom:none}
.set-row:active{background:var(--pink-pale)}
.set-row-lbl{font-size:14px;font-weight:600;color:var(--text)}
.set-row-val{font-size:13px;color:var(--text-mid);font-weight:500}

/* ── MODALS ── */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(45,21,32,.55);display:none;align-items:flex-end;justify-content:center;max-width:430px;left:50%;transform:translateX(-50%);right:auto;width:100%}
.overlay.open{display:flex}
.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);animation:slideUp .28s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--pink-border);margin:12px auto 0}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px}
.sheet-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text)}
.sheet-close{width:30px;height:30px;border-radius:10px;border:none;background:var(--pink-pale);cursor:pointer;font-size:16px;color:var(--text-mid);display:flex;align-items:center;justify-content:center}
.sheet-body{padding:0 18px 8px}

/* ── FORM ── */
.fg{margin-bottom:13px}
.fl{font-size:11px;font-weight:700;color:var(--text-mid);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;display:block}
.fi{width:100%;padding:11px 13px;border:1.5px solid var(--pink-border);border-radius:12px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:500;color:var(--text);background:#fff;outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--pink)}
.fi::placeholder{color:var(--text-light)}
.frow{display:flex;gap:10px}.frow .fg{flex:1}

/* ── TOGGLE ROW ── */
.trow{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--pink-pale);border-radius:12px;margin-bottom:7px;cursor:pointer;border:1.5px solid var(--pink-border)}
.trow-lbl{font-size:14px;font-weight:700;color:var(--text)}
.tsw{width:40px;height:23px;border-radius:12px;background:var(--pink-border);position:relative;transition:background .2s;flex-shrink:0}
.tsw.on{background:var(--pink)}
.tsw-k{width:17px;height:17px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tsw.on .tsw-k{transform:translateX(17px)}
.tcontent{display:none;padding:10px 0 3px 12px;border-left:3px solid var(--pink-light);margin-bottom:6px}
.tcontent.open{display:block}

/* ── METHOD GRID ── */
.meth-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.meth-btn{padding:9px;border-radius:11px;border:1.5px solid var(--pink-border);background:#fff;font-size:12px;font-weight:700;color:var(--text-mid);cursor:pointer;font-family:'Poppins',sans-serif;text-align:center;transition:all .15s}
.meth-btn.sel{background:var(--pink-pale);border-color:var(--pink);color:var(--pink-dark)}

/* ── EQUIP GRID ── */
.eq-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.eq-chip{padding:7px 11px;border-radius:20px;border:1.5px solid var(--pink-border);background:#fff;font-size:12px;font-weight:600;color:var(--text-mid);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;user-select:none}
.eq-chip.sel{background:var(--pink-pale);border-color:var(--pink);color:var(--pink-dark)}
.eq-qty{display:none;align-items:center;gap:4px}
.eq-chip.sel .eq-qty{display:flex}
.qty-btn{width:20px;height:20px;border-radius:6px;border:none;background:var(--pink);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.qty-n{font-size:12px;font-weight:800;min-width:16px;text-align:center;color:var(--pink-dark)}

/* ── BUTTONS ── */
.btn-primary{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#b84d72,#e8719a);border:none;color:#fff;font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 18px rgba(160,50,90,.3);margin-top:8px;transition:transform .1s}
.btn-primary:active{transform:scale(.98)}
.btn-danger{width:100%;padding:12px;border-radius:14px;background:#fff;border:1.5px solid #fdd;color:var(--red);font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}

/* ── CUSTOMER DETAIL ── */
.cust-wrap{padding:18px 18px 8px}
.cust-name{font-family:'DM Serif Display',serif;font-size:30px;color:var(--text);margin-bottom:14px}
.cust-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.cust-icon{font-size:16px;margin-top:1px}
.cust-txt{font-size:14px;color:var(--text-mid);font-weight:500;line-height:1.4}
.cust-txt a{color:var(--pink-dark);text-decoration:none}
.pay-summary{background:var(--pink-pale);border:1.5px solid var(--pink-border);border-radius:14px;padding:14px;margin-top:14px}
.ps-title{font-size:11px;font-weight:800;color:var(--text-light);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}
.ps-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ps-row:last-child{margin-bottom:0}
.ps-lbl{font-size:13px;color:var(--text-mid);font-weight:500}
.ps-val{font-size:14px;font-weight:800;color:var(--text)}
.ps-val.green{color:var(--green)}
.ps-val.orange{color:var(--orange)}
.ps-divider{border:none;border-top:1px solid var(--pink-border);margin:8px 0}

/* ── INVENTORY ── */
.inv-item{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--bg)}
.inv-item:last-child{border-bottom:none}
.inv-name{font-size:14px;font-weight:600;color:var(--text)}
.inv-acts{display:flex;gap:6px}
.inv-btn{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;border:1.5px solid;cursor:pointer;font-family:'Poppins',sans-serif}
.inv-btn.edit-btn{border-color:var(--pink-border);color:var(--pink);background:var(--pink-pale)}
.inv-btn.del-btn{border-color:#fdd;color:var(--red);background:#fff5f5}

/* ── RECEIPT ── */
.rcpt-img{width:100%;border-radius:12px;max-height:55vh;object-fit:contain}

/* ── EMPTY ── */
.empty{text-align:center;padding:44px 20px}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.35}
.empty-txt{font-size:14px;color:var(--text-light);font-weight:600}

/* ── UTILS ── */
.divider{border:none;border-top:1px solid var(--pink-border);margin:8px 0}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div class="pin-logo">CHS Books</div>
  <div class="pin-tagline">Bookkeeping Dashboard</div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pp('1')">1</button>
    <button class="pin-btn" onclick="pp('2')">2<span class="pin-sub">ABC</span></button>
    <button class="pin-btn" onclick="pp('3')">3<span class="pin-sub">DEF</span></button>
    <button class="pin-btn" onclick="pp('4')">4<span class="pin-sub">GHI</span></button>
    <button class="pin-btn" onclick="pp('5')">5<span class="pin-sub">JKL</span></button>
    <button class="pin-btn" onclick="pp('6')">6<span class="pin-sub">MNO</span></button>
    <button class="pin-btn" onclick="pp('7')">7<span class="pin-sub">PQRS</span></button>
    <button class="pin-btn" onclick="pp('8')">8<span class="pin-sub">TUV</span></button>
    <button class="pin-btn" onclick="pp('9')">9<span class="pin-sub">WXYZ</span></button>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────────
const FB = 'https://chs-party-rentals-default-rtdb.firebaseio.com';
const PINS = ['7679','0818'];
const TRACKER_KEY_MAP = {
  mw_monkey:'Monkey Moonwalk',mw_rb_castle:'Red & Blue Castle Moonwalk',
  mw_blue_pointy:'Blue Pointy Castle Moonwalk',mw_pink:'Pink Short Moonwalk',
  mw_purple:'Purple Castle Moonwalk',combo_red:'Red Combo',combo_orange:'Orange Combo',
  slide_red20:"20' Red Double Water Slide",slide_purple20:"20' Purple Waterslide",
  slide_palm20:"20' Palm Waterslide",slide_pink20:"20' Pink Waterslide",
  slide_palm13:"13' Palm Waterslide",slide_blue13:"13' Blue Waterslide",
  tent_20x20:'Party Tent 20x20',tent_20x40:'Party Tent 20x40',tent_40x40:'Party Tent 40x40',
  chair_white:'White Plastic Chairs',chair_black:'Black Metal Chairs',
  table_6ft:'6ft Tables',table_8ft:'8ft Tables',margarita:'Double Tank Margarita Machine'
};
const QTY_ITEMS = ['White Plastic Chairs','Black Metal Chairs','6ft Tables','8ft Tables'];
const DEFAULT_INV = [
  'Monkey Moonwalk','Red & Blue Castle Moonwalk','Blue Pointy Castle Moonwalk',
  'Pink Short Moonwalk','Purple Castle Moonwalk','Red Combo','Orange Combo',
  "20' Red Double Water Slide","20' Purple Waterslide","20' Palm Waterslide",
  "20' Pink Waterslide","13' Palm Waterslide","13' Blue Waterslide",
  'Party Tent 20x20','Party Tent 20x40','Party Tent 40x40',
  '6ft Tables','8ft Tables','White Plastic Chairs','Black Metal Chairs',
  'Double Tank Margarita Machine'
];
const DEFAULT_SETTINGS = {
  reserve:30, bankBalance:4280,
  partners:[{name:'Carlos Lopez',pct:45},{name:'Saul Lopez',pct:45},{name:'Hugo Lopez',pct:10}]
};
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ── STATE ──────────────────────────────────────────────────────────────────
let income=[], expenses=[], inventory=[...DEFAULT_INV];
let settings={...DEFAULT_SETTINGS, partners:DEFAULT_SETTINGS.partners.map(p=>({...p}))};
let curTab='income', curFilter='day';
let sumMonth=new Date().getMonth(), sumYear=new Date().getFullYear();
let editId=null, depMeth='', remMeth='', selEq={}, rcptB64='';

// ── FIREBASE ───────────────────────────────────────────────────────────────
async function fbGet(p){
  try{const r=await fetch(`${FB}/${p}.json`);return r.ok?await r.json():null;}
  catch{return null;}
}
async function fbSet(p,d){
  try{const r=await fetch(`${FB}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return r.ok;}
  catch{return false;}
}

async function loadData(){
  setSyncing(true);
  try{
    const raw=await fbGet('chs_bookkeeper');
    if(raw){
      income=raw.income?(Array.isArray(raw.income)?raw.income:Object.values(raw.income)):[];
      expenses=raw.expenses?(Array.isArray(raw.expenses)?raw.expenses:Object.values(raw.expenses)):[];
      if(raw.inventory&&raw.inventory.length)inventory=raw.inventory;
      if(raw.settings)settings={...DEFAULT_SETTINGS,...raw.settings,partners:raw.settings.partners||DEFAULT_SETTINGS.partners};
    }
  }finally{setSyncing(false);}
}

async function saveData(){
  setSyncing(true);
  await fbSet('chs_bookkeeper',{income,expenses,inventory,settings});
  setSyncing(false);
}

async function syncTracker(){
  try{
    const data=await fbGet('chs_app');
    if(!data||!data.rentals)return;
    const rentals=Array.isArray(data.rentals)?data.rentals:Object.values(data.rentals);
    let changed=false;
    for(const r of rentals){
      if(!r.id||income.find(i=>i.trackerId===r.id))continue;
      const eq=[];
      if(r.equipment&&typeof r.equipment==='object'){
        Object.entries(r.equipment).forEach(([k,qty])=>{
          if(!qty||qty<=0)return;
          const name=TRACKER_KEY_MAP[k]||k;
          eq.push(QTY_ITEMS.includes(name)&&qty>1?`${name} ×${qty}`:name);
        });
      }
      income.push({
        id:'tr_'+r.id,trackerId:r.id,fromTracker:true,
        date:r.date||'',customerName:r.name||'',phone:r.phone||'',address:r.address||'',
        equipment:eq,totalAmount:r.quote||0,
        depositPaid:r.depositEnabled||false,depositAmt:r.depositAmt||0,
        depositDate:'',depositMethod:r.depositMethod||'',
        remainingPaid:false,remainingAmt:0,remainingDate:'',remainingMethod:'',notes:r.notes||''
      });
      changed=true;
    }
    if(changed)await saveData();
  }catch(e){console.error('Sync err:',e);}
}

function setSyncing(b){
  const d=document.getElementById('sync-dot');
  if(d)d.className='sync-dot'+(b?' syncing':'');
}

// ── PIN ────────────────────────────────────────────────────────────────────
let pinStr='';
function pp(d){if(pinStr.length>=4)return;pinStr+=d;updateDots();if(pinStr.length===4)checkPin();}
function pdel(){pinStr=pinStr.slice(0,-1);updateDots();document.getElementById('pin-error').textContent='';}
function updateDots(){for(let i=0;i<4;i++)document.getElementById('pd'+i).classList.toggle('filled',i<pinStr.length);}
function checkPin(){
  if(PINS.includes(pinStr)){
    sessionStorage.setItem('chs_bk_auth','1');
    const s=document.getElementById('pin-screen');
    s.style.transition='opacity .3s';s.style.opacity='0';
    setTimeout(()=>{s.style.display='none';document.getElementById('app').style.display='flex';},300);
  }else{
    document.getElementById('pin-error').textContent='Incorrect PIN. Try again.';
    pinStr='';updateDots();
    const dots=document.getElementById('pin-dots');
    dots.style.animation='shake .3s ease';
    setTimeout(()=>dots.style.animation='',300);
  }
}
function signOut(){sessionStorage.removeItem('chs_bk_auth');location.reload();}

// ── NAV ────────────────────────────────────────────────────────────────────
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+t).classList.add('active');
  document.getElementById('nav-'+t).classList.add('active');
  document.getElementById('fab').className='fab'+(t==='income'||t==='expenses'?'':' gone');
  document.getElementById('scroll-body').scrollTop=0;
  if(t==='income')renderIncome();
  if(t==='expenses')renderExpenses();
  if(t==='summary')renderSummary();
  if(t==='settings')renderSettings();
}

// ── FILTER ─────────────────────────────────────────────────────────────────
function setFilter(f,btn){
  curFilter=f;
  document.querySelectorAll('.filt-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('custom-range').classList.toggle('open',f==='custom');
  renderIncome();
}
function filteredIncome(){
  const now=new Date();
  const today=now.toISOString().split('T')[0];
  return income.filter(r=>{
    if(!r.date)return false;
    if(curFilter==='day')return r.date===today;
    if(curFilter==='week'){const d=new Date(r.date+'T12:00:00');return(now-d)/(86400000)<7&&d<=now;}
    if(curFilter==='month'){const[y,m]=r.date.split('-');return +y===now.getFullYear()&&+m===now.getMonth()+1;}
    if(curFilter==='custom'){
      const f=document.getElementById('cf').value,t=document.getElementById('ct').value;
      if(!f||!t)return true;
      return r.date>=f&&r.date<=t;
    }
    return true;
  });
}

// ── INCOME RENDER ───────────────────────────────────────────────────────────
function renderIncome(){
  const list=filteredIncome();
  const total=list.reduce((s,r)=>s+(parseFloat(r.totalAmount)||0),0);
  document.getElementById('inc-total').textContent='$'+total.toFixed(2);
  document.getElementById('inc-count').textContent=list.length+' rental'+(list.length!==1?'s':'');
  const el=document.getElementById('income-list');
  if(!list.length){el.innerHTML='<div class="empty"><div class="empty-icon">💸</div><div class="empty-txt">No rentals for this period</div></div>';return;}
  const sorted=[...list].sort((a,b)=>b.date.localeCompare(a.date));
  el.innerHTML=sorted.map(r=>{
    const dep=r.depositPaid, rem=r.remainingPaid;
    const isPaid=rem||(r.totalAmount>0&&!dep&&!rem);
    const isPending=dep&&!rem;
    const statusClass=rem?'paid':isPending?'pending':'';
    const badge=rem?'<span class="badge paid">✓ Paid</span>':isPending?'<span class="badge pending">Pending</span>':'';
    const trackerBadge=r.fromTracker?'<span class="badge tracker">Tracker</span>':'';
    const tags=(r.equipment||[]).map(e=>`<span class="ic-tag">${e}</span>`).join('');
    const bal=Math.max(0,(parseFloat(r.totalAmount)||0)-(dep?(parseFloat(r.depositAmt)||0):0));
    const depLine=dep?`<div class="ic-dep-line">Deposit: $${(parseFloat(r.depositAmt)||0).toFixed(2)}${r.depositMethod?' · '+fmtMeth(r.depositMethod):''}</div>`:'';
    const balLine=isPending?`<div class="ic-bal">Balance Due: $${bal.toFixed(2)}</div>`:rem?`<div class="ic-paid-line">Fully Collected ✓</div>`:'';
    return `<div class="ic ${statusClass}">
      <div class="ic-head"><div class="ic-date">${fmtDate(r.date)}</div><div class="ic-badges">${badge}${trackerBadge}</div></div>
      <div class="ic-name" onclick="openCustomer('${r.id}')">${r.customerName||'Unknown Customer'}</div>
      ${tags?`<div class="ic-tags">${tags}</div>`:''}
      <div class="ic-foot">
        <div class="ic-money">
          <div class="ic-total">$${(parseFloat(r.totalAmount)||0).toFixed(2)}</div>
          ${depLine}${balLine}
        </div>
        <div class="ic-btns">
          <button class="ic-btn" onclick="editIncome('${r.id}')">✏️</button>
          <button class="ic-btn danger" onclick="delIncConfirm('${r.id}')">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function fmtDate(d){
  if(!d)return'';
  const[,m,day]=d.split('-');
  return MONTHS[+m-1].slice(0,3)+' '+parseInt(day);
}
function fmtMeth(m){return{cash:'Cash',cashapp:'CashApp',zelle:'Zelle',applepay:'Apple Pay'}[m]||m||'';}

// ── CUSTOMER DETAIL ─────────────────────────────────────────────────────────
function openCustomer(id){
  const r=income.find(i=>i.id===id);if(!r)return;
  const body=document.getElementById('customer-body');
  const dep=parseFloat(r.depositAmt)||0;
  const rem=parseFloat(r.remainingAmt)||0;
  const total=parseFloat(r.totalAmount)||0;
  const bal=Math.max(0,total-(r.depositPaid?dep:0)-(r.remainingPaid?rem:0));
  body.innerHTML=`<div class="cust-wrap">
    <div class="cust-name">${r.customerName||'Unknown'}</div>
    ${r.phone?`<div class="cust-row"><span class="cust-icon">📞</span><div class="cust-txt"><a href="tel:${r.phone}">${r.phone}</a></div></div>`:''}
    ${r.address?`<div class="cust-row"><span class="cust-icon">📍</span><div class="cust-txt">${r.address}</div></div>`:''}
    ${r.date?`<div class="cust-row"><span class="cust-icon">📅</span><div class="cust-txt">${r.date}</div></div>`:''}
    ${r.notes?`<div class="cust-row"><span class="cust-icon">📝</span><div class="cust-txt">${r.notes}</div></div>`:''}
    <div class="pay-summary">
      <div class="ps-title">Payment Summary</div>
      <div class="ps-row"><span class="ps-lbl">Total</span><span class="ps-val">$${total.toFixed(2)}</span></div>
      ${r.depositPaid?`<div class="ps-row"><span class="ps-lbl">Deposit (${fmtMeth(r.depositMethod)})${r.depositDate?' · '+fmtDate(r.depositDate):''}</span><span class="ps-val green">−$${dep.toFixed(2)}</span></div>`:''}
      ${r.remainingPaid?`<div class="ps-row"><span class="ps-lbl">Balance (${fmtMeth(r.remainingMethod)})${r.remainingDate?' · '+fmtDate(r.remainingDate):''}</span><span class="ps-val green">−$${rem.toFixed(2)}</span></div>`:''}
      <hr class="ps-divider">
      <div class="ps-row"><span class="ps-lbl" style="font-weight:700">${bal<=0?'Fully Paid ✓':'Balance Remaining'}</span><span class="ps-val ${bal<=0?'green':'orange'}">$${bal.toFixed(2)}</span></div>
    </div>
  </div>`;
  openM('m-customer');
}

// ── ADD / EDIT INCOME ───────────────────────────────────────────────────────
function openFab(){if(curTab==='expenses'){openAddExpense();}else{openAddIncome();}}

function openAddIncome(){
  editId=null;depMeth='';remMeth='';selEq={};
  document.getElementById('inc-modal-title').textContent='New Rental';
  document.getElementById('del-inc-btn').style.display='none';
  document.getElementById('i-date').value=new Date().toISOString().split('T')[0];
  ['i-amount','i-name','i-phone','i-address','i-notes','i-dep-amt','i-dep-date','i-rem-amt','i-rem-date'].forEach(id=>document.getElementById(id).value='');
  resetTog('dep');resetTog('rem');
  document.querySelectorAll('#dep-meths .meth-btn,#rem-meths .meth-btn').forEach(b=>b.classList.remove('sel'));
  renderEqSelect();
  openM('m-income');
}

function editIncome(id){
  const r=income.find(i=>i.id===id);if(!r)return;
  editId=id;depMeth=r.depositMethod||'';remMeth=r.remainingMethod||'';selEq={};
  (r.equipment||[]).forEach(e=>{
    const m=e.match(/^(.*?)\s*[×x](\d+)$/);
    if(m)selEq[m[1]]=parseInt(m[2]);
    else selEq[e]=1;
  });
  document.getElementById('inc-modal-title').textContent='Edit Rental';
  document.getElementById('del-inc-btn').style.display='block';
  document.getElementById('i-date').value=r.date||'';
  document.getElementById('i-amount').value=r.totalAmount||'';
  document.getElementById('i-name').value=r.customerName||'';
  document.getElementById('i-phone').value=r.phone||'';
  document.getElementById('i-address').value=r.address||'';
  document.getElementById('i-notes').value=r.notes||'';
  setTog('dep',r.depositPaid);
  if(r.depositPaid){document.getElementById('i-dep-amt').value=r.depositAmt||'';document.getElementById('i-dep-date').value=r.depositDate||'';}
  setTog('rem',r.remainingPaid);
  if(r.remainingPaid){document.getElementById('i-rem-amt').value=r.remainingAmt||'';document.getElementById('i-rem-date').value=r.remainingDate||'';}
  document.querySelectorAll('#dep-meths .meth-btn').forEach(b=>{
    const m=b.onclick.toString().match(/'([^']+)'/);
    if(m&&m[1]==='dep')return;
    // get second param
    const parts=b.onclick.toString().match(/'([^']+)',\s*'([^']+)'/);
    if(parts)b.classList.toggle('sel',parts[2]===r.depositMethod);
  });
  document.querySelectorAll('#rem-meths .meth-btn').forEach(b=>{
    const parts=b.onclick.toString().match(/'([^']+)',\s*'([^']+)'/);
    if(parts)b.classList.toggle('sel',parts[2]===r.remainingMethod);
  });
  renderEqSelect();
  openM('m-income');
}

function renderEqSelect(){
  document.getElementById('eq-select').innerHTML=inventory.map((item,i)=>{
    const sel=item in selEq;
    const isQty=QTY_ITEMS.includes(item);
    const qty=selEq[item]||1;
    return `<div class="eq-chip${sel?' sel':''}" id="chip${i}" onclick="toggleEq('${item.replace(/'/g,"\\'").replace(/"/g,'&quot;')}',${i})">
      <span>${item}</span>
      ${isQty&&sel?`<div class="eq-qty">
        <button class="qty-btn" onclick="event.stopPropagation();changeQty('${item.replace(/'/g,"\\'").replace(/"/g,'&quot;')}',${i},-1)">−</button>
        <span class="qty-n" id="qn${i}">${qty}</span>
        <button class="qty-btn" onclick="event.stopPropagation();changeQty('${item.replace(/'/g,"\\'").replace(/"/g,'&quot;')}',${i},1)">+</button>
      </div>`:''}
    </div>`;
  }).join('');
}

function toggleEq(item,i){
  if(item in selEq)delete selEq[item];
  else selEq[item]=1;
  renderEqSelect();
}
function changeQty(item,i,d){
  selEq[item]=Math.max(1,(selEq[item]||1)+d);
  renderEqSelect();
}

async function saveIncome(){
  const name=document.getElementById('i-name').value.trim();
  const date=document.getElementById('i-date').value;
  if(!name||!date){alert('Customer name and date are required.');return;}
  const eq=Object.entries(selEq).map(([item,qty])=>QTY_ITEMS.includes(item)&&qty>1?`${item} ×${qty}`:item);
  const dep=document.getElementById('tsw-dep').classList.contains('on');
  const rem=document.getElementById('tsw-rem').classList.contains('on');
  const rec={
    id:editId||Date.now().toString(),date,customerName:name,
    phone:document.getElementById('i-phone').value.trim(),
    address:document.getElementById('i-address').value.trim(),
    equipment:eq,totalAmount:parseFloat(document.getElementById('i-amount').value)||0,
    depositPaid:dep,depositAmt:dep?parseFloat(document.getElementById('i-dep-amt').value)||0:0,
    depositDate:dep?document.getElementById('i-dep-date').value:'',depositMethod:dep?depMeth:'',
    remainingPaid:rem,remainingAmt:rem?parseFloat(document.getElementById('i-rem-amt').value)||0:0,
    remainingDate:rem?document.getElementById('i-rem-date').value:'',remainingMethod:rem?remMeth:'',
    notes:document.getElementById('i-notes').value.trim(),fromTracker:false
  };
  if(editId){const idx=income.findIndex(i=>i.id===editId);if(idx>=0)income[idx]={...income[idx],...rec};}
  else income.push(rec);
  await saveData();
  closeM('m-income');renderIncome();
}

async function deleteIncome(){
  if(!editId||!confirm('Delete this rental?'))return;
  income=income.filter(i=>i.id!==editId);
  await saveData();closeM('m-income');renderIncome();
}
async function delIncConfirm(id){
  if(!confirm('Delete this rental?'))return;
  income=income.filter(i=>i.id!==id);
  await saveData();renderIncome();
}

// ── EXPENSES ────────────────────────────────────────────────────────────────
function openAddExpense(){
  rcptB64='';
  document.getElementById('e-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('e-amount').value='';
  document.getElementById('e-desc').value='';
  document.getElementById('rcpt-lbl').textContent='Tap to upload receipt';
  document.getElementById('rcpt-preview').style.display='none';
  document.getElementById('e-receipt-input').value='';
  openM('m-expense');
}
function handleReceipt(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    rcptB64=ev.target.result;
    document.getElementById('rcpt-lbl').textContent='✓ '+f.name;
    document.getElementById('rcpt-preview-img').src=rcptB64;
    document.getElementById('rcpt-preview').style.display='block';
  };
  r.readAsDataURL(f);
}
function clearReceipt(){
  rcptB64='';
  document.getElementById('rcpt-lbl').textContent='Tap to upload receipt';
  document.getElementById('rcpt-preview').style.display='none';
  document.getElementById('e-receipt-input').value='';
}
async function saveExpense(){
  const desc=document.getElementById('e-desc').value.trim();
  const date=document.getElementById('e-date').value;
  if(!desc||!date){alert('Description and date required.');return;}
  expenses.push({id:Date.now().toString(),date,description:desc,amount:parseFloat(document.getElementById('e-amount').value)||0,receipt:rcptB64});
  await saveData();closeM('m-expense');renderExpenses();
}
function renderExpenses(){
  const now=new Date();
  const mExp=expenses.filter(e=>{if(!e.date)return false;const[y,m]=e.date.split('-');return+y===now.getFullYear()&&+m===now.getMonth()+1;});
  document.getElementById('exp-total').textContent='$'+(mExp.reduce((s,e)=>s+(parseFloat(e.amount)||0),0)).toFixed(2);
  const el=document.getElementById('expense-list');
  if(!expenses.length){el.innerHTML='<div class="empty"><div class="empty-icon">🧾</div><div class="empty-txt">No expenses yet</div></div>';return;}
  const sorted=[...expenses].sort((a,b)=>b.date.localeCompare(a.date));
  el.innerHTML=sorted.map(e=>`<div class="ec" onclick="viewExpense('${e.id}')">
    <div class="ec-thumb">${e.receipt?`<img src="${e.receipt}" alt="">`:'🧾'}</div>
    <div class="ec-info">
      <div class="ec-desc">${e.description}</div>
      <div class="ec-date">${fmtDate(e.date)}</div>
    </div>
    <div class="ec-right">
      <div class="ec-amt">−$${(parseFloat(e.amount)||0).toFixed(2)}</div>
      ${e.receipt?'<span class="ec-rcpt">📷 Receipt</span>':''}
    </div>
  </div>`).join('');
}
function viewExpense(id){
  const e=expenses.find(x=>x.id===id);if(!e)return;
  document.getElementById('rcpt-view-title').textContent=e.description;
  document.getElementById('receipt-view-body').innerHTML=`
    <div style="padding:0 18px 24px">
      <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--pink-border)"><span style="color:var(--text-mid);font-size:13px">Date</span><span style="font-weight:700;font-size:13px">${e.date}</span></div>
      <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--pink-border)"><span style="color:var(--text-mid);font-size:13px">Amount</span><span style="font-weight:800;font-size:16px;color:var(--red)">$${(parseFloat(e.amount)||0).toFixed(2)}</span></div>
      ${e.receipt?`<div style="padding:14px 0"><img src="${e.receipt}" class="rcpt-img" alt="Receipt"></div>`:'<div style="padding:20px 0;text-align:center;color:var(--text-light)">No receipt photo attached</div>'}
      <button onclick="delExpense('${e.id}')" class="btn-danger" style="margin-top:4px">Delete Expense</button>
    </div>`;
  openM('m-receipt');
}
async function delExpense(id){
  if(!confirm('Delete this expense?'))return;
  expenses=expenses.filter(e=>e.id!==id);
  await saveData();closeM('m-receipt');renderExpenses();
}

// ── SUMMARY ─────────────────────────────────────────────────────────────────
function changeMonth(d){
  sumMonth+=d;
  if(sumMonth>11){sumMonth=0;sumYear++;}
  if(sumMonth<0){sumMonth=11;sumYear--;}
  renderSummary();
}
function renderSummary(){
  document.getElementById('sum-month').textContent=MONTHS[sumMonth]+' '+sumYear;
  const mInc=income.filter(r=>{if(!r.date)return false;const[y,m]=r.date.split('-');return+y===sumYear&&+m===sumMonth+1;});
  const gross=mInc.reduce((s,r)=>s+(parseFloat(r.totalAmount)||0),0);
  const resPct=settings.reserve||30;
  const resAmt=gross*(resPct/100);
  const distrib=gross-resAmt;
  document.getElementById('sum-content').innerHTML=`
    <div class="sum-card">
      <div class="sum-card-lbl">Gross Income</div>
      <div class="sum-card-amt">$${gross.toFixed(2)}</div>
      <div class="sum-card-sub">${mInc.length} rental${mInc.length!==1?'s':''}</div>
    </div>
    <div class="reserve-wrap">
      <div class="res-row">
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--pink-dark);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px">Business Reserve</div>
          <div class="res-amt">$${resAmt.toFixed(2)}</div>
        </div>
        <div class="res-pct" id="res-pct-lbl">${resPct}%</div>
      </div>
      <input type="range" class="reserve-slider" min="0" max="100" value="${resPct}" oninput="updateReserve(this.value)">
      <div style="display:flex;justify-content:space-between"><span style="font-size:11px;color:var(--text-light)">0%</span><span style="font-size:11px;color:var(--text-light)">100%</span></div>
    </div>
    <div class="sum-card" style="margin-bottom:14px">
      <div class="sum-card-lbl">Distributable</div>
      <div class="sum-card-amt green">$${distrib.toFixed(2)}</div>
      <div class="sum-card-sub">After ${resPct}% reserve</div>
    </div>
    <div class="section-lbl">Partner Payouts</div>
    ${settings.partners.map(p=>`<div class="partner-row">
      <div class="pr-left">
        <div class="pr-name">${p.name}</div>
        <div class="pr-pct">${p.pct}% of distributable</div>
      </div>
      <div class="pr-amt">$${(distrib*(p.pct/100)).toFixed(2)}</div>
    </div>`).join('')}
  `;
}
async function updateReserve(v){
  settings.reserve=parseInt(v);
  const lbl=document.getElementById('res-pct-lbl');
  if(lbl)lbl.textContent=v+'%';
  await saveData();
  renderSummary();
}

// ── SETTINGS ─────────────────────────────────────────────────────────────────
function renderSettings(){
  document.getElementById('set-content').innerHTML=`
    <div class="set-group">
      <div class="set-group-title">Bank Balance</div>
      <div style="padding:12px 15px;display:flex;align-items:center;gap:8px">
        <span style="font-size:18px;font-weight:800;color:var(--pink-dark)">$</span>
        <input type="number" class="fi" id="bank-inp" value="${settings.bankBalance||0}" step="0.01" min="0" style="flex:1" onchange="saveBankBal(this.value)">
      </div>
    </div>
    <div class="set-group">
      <div class="set-group-title">Business Reserve</div>
      <div style="padding:14px 15px;display:flex;align-items:center;gap:10px">
        <input type="range" class="reserve-slider" min="0" max="100" value="${settings.reserve}" style="flex:1" oninput="document.getElementById('set-res-val').textContent=this.value+'%';settings.reserve=parseInt(this.value);saveData()">
        <span style="font-size:17px;font-weight:800;color:var(--pink-dark);min-width:44px;text-align:right" id="set-res-val">${settings.reserve}%</span>
      </div>
    </div>
    <div class="set-group">
      <div class="set-group-title">Partners & Splits</div>
      ${settings.partners.map((p,i)=>`<div style="padding:11px 15px;border-bottom:1px solid var(--bg);display:flex;align-items:center;gap:8px">
        <input type="text" value="${p.name}" style="flex:1;padding:8px 10px;border:1.5px solid var(--pink-border);border-radius:10px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:var(--text);outline:none" onchange="settings.partners[${i}].name=this.value;saveData()">
        <input type="number" value="${p.pct}" min="0" max="100" style="width:55px;padding:8px;border:1.5px solid var(--pink-border);border-radius:10px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:800;color:var(--pink-dark);outline:none;text-align:center" onchange="settings.partners[${i}].pct=parseInt(this.value)||0;saveData()">
        <span style="font-size:12px;color:var(--text-light);font-weight:700">%</span>
      </div>`).join('')}
    </div>
    <div class="set-group">
      <div class="set-group-title">Inventory</div>
      <div class="set-row" onclick="openInvModal()">
        <span class="set-row-lbl">Manage Equipment List</span>
        <span class="set-row-val">${inventory.length} items ›</span>
      </div>
    </div>
    <div class="set-group">
      <div class="set-group-title">Tracker Sync</div>
      <div class="set-row" onclick="manualSync()">
        <span class="set-row-lbl">Sync from CHS Tracker</span>
        <span class="set-row-val">Pull now ›</span>
      </div>
    </div>
  `;
}
async function saveBankBal(v){settings.bankBalance=parseFloat(v)||0;await saveData();}
async function manualSync(){await syncTracker();renderIncome();alert('Sync complete!');}

// ── INVENTORY MODAL ──────────────────────────────────────────────────────────
function openInvModal(){
  renderInvList();
  openM('m-inventory');
}
function renderInvList(){
  document.getElementById('inv-list').innerHTML=inventory.map((item,i)=>`
    <div class="inv-item">
      <div class="inv-name">${item}</div>
      <div class="inv-acts">
        <button class="inv-btn edit-btn" onclick="renameInv(${i})">Rename</button>
        <button class="inv-btn del-btn" onclick="removeInv(${i})">Del</button>
      </div>
    </div>`).join('');
}
async function addInvItem(){
  const inp=document.getElementById('inv-new');
  const name=inp.value.trim();
  if(!name)return;
  if(inventory.includes(name)){alert('Already exists.');return;}
  inventory.push(name);inp.value='';
  await saveData();renderInvList();
}
async function removeInv(i){
  if(!confirm(`Remove "${inventory[i]}"?`))return;
  inventory.splice(i,1);await saveData();renderInvList();
}
async function renameInv(i){
  const n=prompt('Rename:',inventory[i]);
  if(n&&n.trim()&&n.trim()!==inventory[i]){inventory[i]=n.trim();await saveData();renderInvList();}
}

// ── TOGGLE HELPERS ───────────────────────────────────────────────────────────
function toggleSec(n){
  const sw=document.getElementById('tsw-'+n);
  const isOn=sw.classList.toggle('on');
  document.getElementById('tc-'+n).classList.toggle('open',isOn);
}
function resetTog(n){document.getElementById('tsw-'+n).classList.remove('on');document.getElementById('tc-'+n).classList.remove('open');}
function setTog(n,v){document.getElementById('tsw-'+n).classList.toggle('on',v);document.getElementById('tc-'+n).classList.toggle('open',v);}
function selMeth(type,meth,btn){
  const grid=type==='dep'?'dep-meths':'rem-meths';
  document.querySelectorAll('#'+grid+' .meth-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  if(type==='dep')depMeth=meth;else remMeth=meth;
}

// ── MODAL HELPERS ────────────────────────────────────────────────────────────
function openM(id){document.getElementById(id).classList.add('open');}
function closeM(id){document.getElementById(id).classList.remove('open');}
// Close on overlay tap
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});

// ── INIT ─────────────────────────────────────────────────────────────────────
(async()=>{
  if(sessionStorage.getItem('chs_bk_auth')==='1'){
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('app').style.display='flex';
  }
  await loadData();
  await syncTracker();
  renderIncome();
  renderExpenses();
})();
</script>
